{
  "visual_slam": {
    "ros__parameters": {
      "use_sim_time": true,
      "num_cameras": 2,
      "min_num_images": 2,
      "tracking_mode": 1,
      "image_qos": "DEFAULT",
      "enable_localization_n_mapping": false,
      "rectified_images": true,
      "sync_matching_threshold_ms": 1.0,
      "image_jitter_threshold_ms": 60.0,
      "imu_jitter_threshold_ms": 12.0,
      "calibration_frequency": 250.0,
      "image_buffer_size": 100,
      "imu_buffer_size": 400,
      "base_frame": "base_link",
      "odom_frame": "odom",
      "map_frame": "map",
      "imu_frame": "vio_imu",
      "camera_optical_frames": [
        "vio_left_optical",
        "vio_right_optical"
      ],
      "publish_map_to_odom_tf": false,
      "publish_odom_to_base_tf": false
    }
  }
}
