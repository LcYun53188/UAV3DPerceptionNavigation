px4_comm_bridge:
  ros__parameters:
    enable_data_bridge: true
    enable_control_bridge: true

    px4_odometry_topic: /px4/vehicle_odometry
    px4_imu_topic: /px4/vehicle_imu
    px4_gps_topic: /fmu/out/sensor_gps
    px4_attitude_topic: /fmu/out/vehicle_attitude
    pub_odometry: /px4/odom
    pub_imu: /px4/imu
    pub_gps: /gps/fix
    pub_attitude: /px4/attitude

    planner_cmd_topic: /nav/cmd_vel
    planner_pose_topic: /nav/cmd_pose
    planner_emergency_topic: /nav/emergency
    planner_safety_topic: /nav/safety_status

    fmu_offboard_mode_topic: /fmu/in/offboard_control_mode
    fmu_trajectory_topic: /fmu/in/trajectory_setpoint
    fmu_command_topic: /fmu/in/vehicle_command

    control_rate_hz: 20.0
    input_velocity_frame: enu
    # Single authorization for automatic arm/mode entry; disabled by default.
    auto_arm: false
    px4_vehicle_status_topic: /fmu/out/vehicle_status
    px4_command_ack_topic: /fmu/out/vehicle_command_ack
    sm_prestream_sec: 1.5
    sm_transition_timeout_sec: 5.0
    sm_status_timeout_sec: 1.0
    emergency_action: land
    cmd_timeout_sec: 0.5
    target_system: 1
    target_component: 1
